# Render Blueprint — API (gateway+generation) + Connect agent (noVNC browser).
# Fill secrets when prompted (never commit keys):
#   NVIDIA_API_KEY, AGNES_API_KEY, CORS_ORIGINS
# Optional: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# After first deploy, set on rivalradar-api (Environment):
#   CONNECT_AGENT_URL=https://<rivalradar-connect>.onrender.com
#   CONNECT_VIEWER_URL=https://<rivalradar-connect>.onrender.com/vnc.html?autoconnect=1&resize=scale
# Connect needs RAM for Chromium — if free tier OOMs, bump rivalradar-connect to Starter.
# Frontend (Vercel): NEXT_PUBLIC_GATEWAY_URL → rivalradar-api URL.
# Social platform cookies are NEVER loaded from env — users sign in via Connect browser.

services:
  - type: web
    name: rivalradar-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: MISSION_TEXT_MODEL
        value: gptoss
      - key: MISSION_IMAGE_MODEL
        value: agnes
      - key: NVIDIA_API_KEY
        sync: false
      - key: AGNES_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_TEXT_MODEL
        value: openai/gpt-oss-20b
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: AGNES_IMAGE_MODEL
        value: agnes-image-2.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: rivalradar-db
          property: connectionString
      - key: REDIS_URL
        value: memory
      - key: CONNECTION_VAULT_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: ""
      - key: DISALLOW_ENV_SOCIAL_COOKIES
        value: "true"
      - key: GENERATION_SERVICE_URL
        value: http://127.0.0.1:8003
      # After connect service is live, set both to that service's public HTTPS URL
      # (viewer = same host + /vnc.html?autoconnect=1&resize=scale).
      - key: CONNECT_AGENT_URL
        value: ""
      - key: CONNECT_VIEWER_URL
        value: ""

  - type: web
    name: rivalradar-connect
    runtime: docker
    # Chromium + Xvfb usually needs more than free 512MB; upgrade if the service OOMs.
    plan: free
    region: oregon
    dockerfilePath: ./services/connect-agent/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: connect-profiles
      mountPath: /data/profiles
      sizeGB: 1
    envVars:
      - key: CONNECT_IN_DOCKER
        value: "1"
      - key: CONNECT_PORT
        value: "8765"
      - key: NOVNC_PORT
        value: "7900"
      - key: VNC_PORT
        value: "5900"
      # RENDER_EXTERNAL_URL is injected by Render; app builds viewer from it if unset.
      - key: PUBLIC_VIEWER_URL
        value: ""

databases:
  - name: rivalradar-db
    plan: free
    region: oregon
