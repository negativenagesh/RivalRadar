# Render Blueprint — backend API (gateway + generation).
# Fill secrets when prompted (never commit keys):
#   NVIDIA_API_KEY, AGNES_API_KEY, CORS_ORIGINS
# Optional: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Frontend (Vercel): NEXT_PUBLIC_GATEWAY_URL → this service URL.
# Social platform cookies are NEVER loaded from env — users sign in via Connect browser.

services:
  - type: web
    name: rivalradar-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: MISSION_TEXT_MODEL
        value: gptoss
      - key: MISSION_IMAGE_MODEL
        value: agnes
      - key: NVIDIA_API_KEY
        sync: false
      - key: AGNES_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_TEXT_MODEL
        value: openai/gpt-oss-20b
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: AGNES_IMAGE_MODEL
        value: agnes-image-2.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: rivalradar-db
          property: connectionString
      # Mission works without Redis; live scout WS needs a real Redis later.
      - key: REDIS_URL
        value: memory
      - key: CONNECTION_VAULT_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: ""
      - key: DISALLOW_ENV_SOCIAL_COOKIES
        value: "true"
      - key: GENERATION_SERVICE_URL
        value: http://127.0.0.1:8003

databases:
  - name: rivalradar-db
    plan: free
    region: oregon
