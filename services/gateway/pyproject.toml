[project]
name = "gateway-service"
version = "0.1.0"
description = "RivalRadar gateway/BFF: orchestrates services, owns drafts/review state"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "agent-events",
    "fakeredis>=2.26.0",
]

[tool.uv.sources]
agent-events = { path = "../../libs/agent_events", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "fakeredis>=2.26.0",
]
