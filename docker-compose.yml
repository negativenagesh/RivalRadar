name: rivalradar

x-env: &common-env
  LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
  GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.6-flash}
  GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
  # Mission defaults (gpt-oss text + Agnes image) when the operator pasted no keys.
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
  NVIDIA_TEXT_MODEL: ${NVIDIA_TEXT_MODEL:-openai/gpt-oss-20b}
  NVIDIA_IMAGE_MODEL: ${NVIDIA_IMAGE_MODEL:-black-forest-labs/flux.1-schnell}
  AGNES_API_KEY: ${AGNES_API_KEY:-}
  AGNES_BASE_URL: ${AGNES_BASE_URL:-https://apihub.agnes-ai.com/v1}
  AGNES_IMAGE_MODEL: ${AGNES_IMAGE_MODEL:-agnes-image-2.5-flash}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_TEXT_MODEL: ${DEEPSEEK_TEXT_MODEL:-deepseek-flash}
  MISSION_TEXT_MODEL: ${MISSION_TEXT_MODEL:-gptoss}
  MISSION_IMAGE_MODEL: ${MISSION_IMAGE_MODEL:-agnes}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivalradar
      POSTGRES_PASSWORD: rivalradar
      POSTGRES_DB: rivalradar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivalradar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://rivalradar:rivalradar@postgres:5432/rivalradar
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ROOT: /data/objects
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CONNECT_IN_DOCKER: "1"
    ports:
      - "8001:8000"
    shm_size: "1gb"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - object_store:/data/objects

  intelligence:
    build:
      context: .
      dockerfile: services/intelligence/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://rivalradar:rivalradar@postgres:5432/rivalradar
      INGESTION_SERVICE_URL: http://ingestion:8000
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ingestion:
        condition: service_started

  generation:
    build:
      context: .
      dockerfile: services/generation/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "8003:8000"

  compliance:
    build:
      context: .
      dockerfile: services/compliance/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "8004:8000"

  connect-agent:
    build:
      context: .
      dockerfile: services/connect-agent/Dockerfile
    restart: unless-stopped
    environment:
      CONNECT_IN_DOCKER: "1"
      DISPLAY: ":99"
      CONNECT_PROFILE_ROOT: /data/profiles
      PUBLIC_VIEWER_URL: ${CONNECT_VIEWER_URL:-http://localhost:7900/vnc.html?autoconnect=1&resize=scale}
    ports:
      - "8765:8765"
      - "7900:7900"
    shm_size: "1gb"
    volumes:
      - connect_profiles:/data/profiles

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://rivalradar:rivalradar@postgres:5432/rivalradar
      REDIS_URL: redis://redis:6379/0
      INGESTION_SERVICE_URL: http://ingestion:8000
      INTELLIGENCE_SERVICE_URL: http://intelligence:8000
      GENERATION_SERVICE_URL: http://generation:8000
      COMPLIANCE_SERVICE_URL: http://compliance:8000
      CONNECT_AGENT_URL: ${CONNECT_AGENT_URL:-http://connect-agent:8765}
      CONNECT_VIEWER_URL: ${CONNECT_VIEWER_URL:-http://localhost:7900/vnc.html?autoconnect=1&resize=scale}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DISALLOW_ENV_SOCIAL_COOKIES: ${DISALLOW_ENV_SOCIAL_COOKIES:-true}
      CONNECTION_VAULT_KEY: ${CONNECTION_VAULT_KEY:-}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingestion:
        condition: service_started
      intelligence:
        condition: service_started
      generation:
        condition: service_started
      compliance:
        condition: service_started
      connect-agent:
        condition: service_healthy
    volumes:
      - object_store:/data/objects

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8000}
    environment:
      # Bind all interfaces so Docker HEALTHCHECK (localhost:3000) works
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
  object_store:
  connect_profiles:
