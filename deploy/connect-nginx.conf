# RivalRadar Connect (Render single-port): noVNC + agent API on $PORT.
# Browser opens /vnc.html; gateway calls /health and /sessions on the same host.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 128;
}

http {
  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 20m;

  # Agent API (uvicorn on 127.0.0.1:8765)
  upstream connect_api {
    server 127.0.0.1:8765;
  }

  # websockify / noVNC on 127.0.0.1:7900
  upstream novnc {
    server 127.0.0.1:7900;
  }

  server {
    listen 8080;
    server_name _;

    location = /health {
      proxy_pass http://connect_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /sessions {
      proxy_pass http://connect_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    location /websockify {
      proxy_pass http://novnc;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://novnc;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
