[project]
name = "agent-events"
version = "0.1.0"
description = "Shared live-progress event bus for RivalRadar agent runs (Redis Streams)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "redis>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_events"]

[dependency-groups]
dev = [
    "fakeredis>=2.26.0",
    "mypy>=2.3.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.6",
]
