[project]
name = "llm-provider"
version = "0.1.0"
description = "Pluggable LLM provider abstraction for RivalRadar services"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.54.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_provider"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.6",
]
