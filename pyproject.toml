[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = [
    "E501",
    "B008",  # FastAPI's Depends()-as-default is the documented idiom, not a bug
]

[tool.ruff.lint.isort]
known-first-party = ["llm_provider"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["frontend", "fixtures"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
